<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#070d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Discord">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&display=swap">
<title>Discord</title>
<style>
:root{--bg:#050a14;--side:#09101f;--rail:#060b17;--pan:#0b1426;--bd:#14213d;--txt:#e6ecf8;--hd:#fff;--mut:#7f8aa3;--acc:#2563eb;--acc2:#3b82f6;--hov:#0e1830;--sel:#0f1f3d;--lnk:#4da3ff;--red:#ef4444;--grn:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
[data-i]{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
html,body{height:var(--vh,100dvh);margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font:15px/1.5 "Noto Sans Arabic","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--txt);background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;outline:0;width:100%}
input:focus,textarea:focus{border-color:var(--acc)}
a{color:var(--lnk);text-decoration:none}a:hover{text-decoration:underline}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#14213d;border-radius:4px}
.btn{display:inline-block;background:var(--acc);color:#fff;border-radius:12px;padding:9px 18px;font-weight:500;font-size:14px}
.btn:hover{background:#1d4ed8;text-decoration:none}.btn.gh{background:#14213d}.btn.gh:hover{background:#1c2f57}
.s1{flex:1}

#login{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 70% 10%,#0f2a66,#050a14 60%)}
#login .box{background:var(--side);border:1px solid var(--bd);padding:32px;border-radius:24px;width:100%;max-width:440px}
#login h2{margin:0 0 8px;text-align:center;color:var(--hd)}#login p{margin:0 0 20px;text-align:center;color:var(--mut)}
#login label,#md label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 6px}
#login .btn{width:100%;margin-top:20px;padding:12px}.err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}

#app{height:var(--vh,100dvh);display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:76px 250px 1fr 260px}
#app.nomem{grid-template-columns:76px 250px 1fr}
#nav{display:contents}
#rail{background:var(--rail);border-inline-start:1px solid var(--bd);overflow-y:auto;padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
#guilds{display:flex;flex-direction:column;gap:10px;align-items:center}
.gi{position:relative;width:52px;height:52px;border-radius:50%;background:var(--pan);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;flex:none;transition:.15s;color:var(--hd)}
.gi img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.gi:hover{border-radius:18px}.gi.on{box-shadow:0 0 0 2px var(--rail),0 0 0 4px var(--acc2)}
.gi.home{background:#101c36}.gi .ico{width:26px;height:26px}.hr{width:32px;height:2px;background:var(--bd);flex:none}
#side{background:var(--side);border-inline-start:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
#gh{padding:0 16px;height:56px;display:flex;align-items:center;font-weight:700;color:var(--hd);border-bottom:1px solid var(--bd);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chs{flex:1;overflow-y:auto;padding:10px}
.cat{display:flex;align-items:center;gap:4px;padding:16px 4px 6px;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;user-select:none}
.cat:hover{color:var(--hd)}.cat i{font-style:normal;display:inline-block;font-size:9px;transition:.15s}
.cat.shut i{transform:rotate(90deg)}.cat.shut+.grp{display:none}
.c{display:flex;align-items:center;gap:8px;padding:9px 12px;margin:3px 0;border-radius:14px;color:#c3cde3;cursor:pointer;border:1px solid transparent;white-space:nowrap;overflow:hidden}
.c .ic{font-size:20px;line-height:1;width:22px;text-align:center;color:var(--mut);flex:none}
.c span:last-child{overflow:hidden;text-overflow:ellipsis}
.c:hover{background:var(--hov)}.c.on{background:var(--sel);border-color:#1d3a78;color:#fff}.c.v{opacity:.5;cursor:default}.c.v:hover{background:none}
#me{height:64px;background:#070d1a;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 10px;flex:none}
#me img{width:38px;height:38px;border-radius:50%}#me .n{flex:1;min-width:0;line-height:1.2;font-weight:700;color:var(--hd)}
#me .n small{display:block;font-weight:400;color:var(--mut);font-size:12px}#me .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#me button{width:34px;height:34px;border-radius:10px;color:var(--mut);font-size:18px}#me button:hover{background:var(--hov);color:var(--hd)}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;background:var(--bg)}
#top{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--bd);font-weight:700;color:var(--hd);flex:none;background:var(--side)}
#top .ic{color:var(--mut);font-size:24px;font-weight:400}#burger{display:none}
#tn{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid}
.pill.sync{background:#0b1b3d;border-color:#1d3a78;color:#8fb4ff}.pill.sync.busy [data-i]{animation:sp .8s linear infinite}
.pill.botc{background:#06220f;border-color:#116b34;color:#4ade80}@keyframes sp{to{transform:rotate(360deg)}}.pill i{font-style:normal;display:inline-block}
#srch{flex:1;max-width:340px;border-radius:999px;padding:7px 16px;font-weight:400;font-size:14px}

#msgs{flex:1;overflow-y:auto;padding:8px 0 16px}
#empty{margin:60px auto;padding:20px;text-align:center;color:var(--mut)}
.m{position:relative;display:flex;gap:14px;padding:4px 20px}
.m.f{margin-top:18px}.m:hover{background:#08101f}
.m .l{width:44px;flex:none;text-align:center}.m .l .av{width:44px;height:44px;border-radius:50%;object-fit:cover;cursor:pointer}
.m .l .ht{display:none;font-size:11px;color:var(--mut);line-height:22px}.m:hover:not(.g) .l .ht{display:block}
.bd{min-width:0;flex:1}.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm{font-weight:700;color:var(--hd);font-size:16px;cursor:pointer}.nm:hover{text-decoration:underline}
.bot{background:var(--acc);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 8px;line-height:20px}
.tm{font-size:12px;color:var(--mut)}
.tx,.ed,.ct{white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:right}.tx{font-size:16px}
.tx code{background:#0b1426;border-radius:4px;padding:1px 5px;font:14px Consolas,monospace;direction:ltr;unicode-bidi:isolate}
.tx pre{background:#0b1426;border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0;font:14px Consolas,monospace;white-space:pre-wrap;direction:ltr;text-align:left}
.sp{background:#14213d;color:transparent;border-radius:4px;cursor:pointer}.sp.on{background:#ffffff14;color:inherit}
.mn{background:#2563eb40;color:#9bbcff;border-radius:5px;padding:0 3px;font-weight:500;cursor:pointer}.mn:hover{background:var(--acc);color:#fff}
.em{width:24px;height:24px;vertical-align:bottom;object-fit:contain}
.act{position:absolute;inset-inline-end:20px;top:-14px;display:none;background:var(--pan);border:1px solid var(--bd);border-radius:10px}
.m:hover .act,.m.long .act{display:block}.act button{padding:4px 10px;color:var(--mut)}.act button:hover{color:var(--red)}
.att img,.att video{max-width:min(420px,100%);max-height:320px;border-radius:14px;display:block;margin-top:6px;cursor:pointer}
.file{display:flex;gap:10px;align-items:center;background:var(--pan);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:6px;max-width:400px}
.vc{display:flex;align-items:center;gap:10px;background:#0a1530;border:1px solid #1a2c52;border-radius:999px;padding:7px 14px 7px 7px;margin-top:6px;max-width:330px;direction:ltr}
.pl{width:34px;height:34px;border-radius:50%;background:#fff;color:#0a1530;flex:none;display:flex;align-items:center;justify-content:center}
.pl .ico{width:16px;height:16px}
.wf{display:flex;align-items:center;gap:2px;height:28px;flex:1;cursor:pointer;min-width:60px}
.wf i{flex:1;min-width:2px;border-radius:2px;background:#4a5e8f}.wf i.p{background:#fff}
.vtm{font-size:12px;color:#b7c4e4;flex:none;min-width:34px}
.vsp{background:#13224a;border:0;border-radius:999px;padding:4px 9px;font-weight:700;color:#cdd7f2;font-size:11px;flex:none}
.vdl{color:#8696c9;flex:none;display:flex}.vdl .ico{width:16px;height:16px}
.embed{display:grid;position:relative;background:var(--pan);border:1px solid var(--bd);border-inline-start:4px solid #14213d;border-radius:12px;padding:10px 14px 14px;margin-top:6px;max-width:520px;font-size:14px;gap:4px}
.embed .eth{position:absolute;inset-inline-end:12px;top:12px;width:80px;max-height:80px;border-radius:8px;object-fit:cover}
.ea{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--hd)}.ea img{width:24px;height:24px;border-radius:50%}
.et{font-weight:700;font-size:16px;color:var(--hd)}.et a{color:var(--lnk)}
.ef{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}.ef div{grid-column:1/-1;min-width:0}.ef div.in{grid-column:auto}.ef b{display:block;color:var(--hd)}
.ei{max-width:100%;border-radius:10px;margin-top:8px}.eft{font-size:12px;color:var(--mut);margin-top:8px}
.cont{background:var(--pan);border:1px solid var(--bd);border-inline-start:4px solid #14213d;border-radius:14px;padding:12px 16px;margin-top:6px;max-width:520px;display:flex;flex-direction:column;gap:8px}
.sep{height:1px;background:#ffffff14;margin:4px 0}.gal img{max-width:100%;border-radius:10px}.row{display:flex;gap:8px;flex-wrap:wrap}
.rxs{display:flex;flex-wrap:wrap;gap:6px;min-height:0}.rxs:not(:empty){margin-top:6px}
.rxadd{opacity:0}.m:hover .rxadd,.m.long .rxadd,.rxs:not(:has(.rxadd:only-child)) .rxadd{opacity:1}
.rx{display:inline-flex;gap:6px;align-items:center;background:var(--pan);border:1px solid var(--bd);border-radius:10px;padding:2px 8px;font-size:14px;cursor:pointer;user-select:none}.rx img{width:16px;height:16px}.rx:hover{border-color:var(--acc)}.rx.me{background:#2563eb33;border-color:var(--acc)}
.rxadd{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--pan);border:1px solid var(--bd);border-radius:10px;cursor:pointer;color:var(--mut)}.rxadd:hover{border-color:var(--acc);color:var(--hd)}.rxadd .ico{width:16px;height:16px}

#mem{background:var(--side);border-inline-end:1px solid var(--bd);overflow-y:auto;padding:12px;min-height:0}
#mem .mh{color:var(--mut);font-size:13px;font-weight:700;padding:14px 6px 8px}
.mb{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px}.mb:hover{background:var(--hov)}
.mb img{width:40px;height:40px;border-radius:50%}.mb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:#c3cde3}

#comp{padding:6px 16px calc(8px + env(safe-area-inset-bottom,0));flex:none;position:relative}
#chips{display:flex;gap:8px;overflow-x:auto;background:var(--pan);border:1px solid var(--bd);border-radius:18px 18px 0 0;padding:8px}#chips:empty{display:none}
.chip{position:relative;width:110px;flex:none;background:var(--side);border-radius:12px;padding:8px;font-size:12px;text-align:center;overflow:hidden}
.chip img{width:100%;height:80px;object-fit:cover;border-radius:8px}.chip span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.chip button{position:absolute;inset-inline-start:4px;top:4px;background:var(--red);width:22px;height:22px;border-radius:8px;font-size:12px;color:#fff}
#bar,#rec{display:flex;align-items:flex-end;background:var(--pan);border:1px solid var(--bd);border-radius:22px;min-height:50px;padding:0 6px}
#chips:not(:empty)+#bar{border-radius:0 0 22px 22px}
#bar button,#rec button{width:42px;height:48px;flex:none;color:var(--mut);font-size:22px;display:flex;align-items:center;justify-content:center}
#bar button:hover{color:var(--hd)}#plus{font-size:28px!important}
#in{background:none;border:0;resize:none;max-height:200px;padding:13px 6px;line-height:22px;height:48px;border-radius:0;font-size:15px}
#snd{color:var(--acc2)!important}#snd span{display:inline-block;transform:scaleX(-1)}
#rec{align-items:center}#rec .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:b 1s infinite}@keyframes b{50%{opacity:.2}}
#rec .t{flex:1;padding:0 10px;color:var(--hd)}
.foot{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;padding:8px 10px 0}
.pop{position:absolute;bottom:calc(76px + env(safe-area-inset-bottom,0));background:#070d1a;border:1px solid var(--bd);border-radius:16px;padding:8px;min-width:210px;box-shadow:0 8px 24px #000a;z-index:20}
#pm{inset-inline-start:16px}#pm2{inset-inline-end:110px}#emo{inset-inline-end:16px;display:grid;grid-template-columns:repeat(8,1fr);min-width:0;width:min(330px,92vw)}
.pop>button{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border-radius:10px}.pop>button:hover{background:var(--acc);color:#fff}
#emo button{font-size:22px;padding:4px;border-radius:8px}#emo button:hover{background:var(--hov)}
#mac{inset-inline-start:16px;padding:6px;max-height:240px;overflow-y:auto;min-width:220px}
#mac button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:10px;text-align:start}
#mac button:hover,#mac button.sel{background:var(--acc);color:#fff}#mac img{width:26px;height:26px;border-radius:50%}#mac small{color:inherit;opacity:.7}

#ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
#md{background:var(--side);border:1px solid var(--bd);border-radius:20px;width:100%;max-width:580px;max-height:92vh;display:flex;flex-direction:column}
#md header{padding:16px 20px;font-size:19px;font-weight:700;color:var(--hd);display:flex;justify-content:space-between}
#md .bd2{padding:0 20px 12px;overflow-y:auto;flex:1}#md footer{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-start;gap:8px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}#md input[type=color]{height:42px;padding:2px}#md input[type=checkbox]{width:auto}
.fr,.cr{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;background:var(--pan);padding:8px;border-radius:12px}.cr{grid-template-columns:90px 1fr}.cr .b{grid-column:2}.cr .x{grid-column:1/-1}
.pv{border:1px dashed #1d3a78;border-radius:14px;padding:8px;margin:12px 0}
.tabs{display:flex;gap:6px;margin:6px 0 4px}.tb{padding:8px 16px;border-radius:12px;background:var(--pan);color:var(--mut);font-weight:500}.tb.on{background:var(--acc);color:#fff}
.pc{position:relative;background:var(--pan);border:1px solid var(--bd);border-radius:18px;overflow:hidden;padding-bottom:14px;margin-bottom:8px}
.pbn{height:96px;background:#10265a center/cover}.pav{width:76px;height:76px;border-radius:50%;border:5px solid var(--pan);margin:-38px 16px 0;display:block;background:#10265a;object-fit:cover}
.pnm{font-size:22px;font-weight:700;margin:2px 18px 0;line-height:1.4}.pun{margin:0 18px;color:var(--mut);font-size:13px}.pbio{margin:8px 18px 0;font-size:14px;white-space:pre-wrap;color:#c3cde3}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}.fb,.eb{background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}
.fb span{display:block;font-size:19px;line-height:1.5;color:var(--hd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fb small{color:var(--mut);font-size:11px}
.fb.on,.eb.on{border-color:var(--acc2);background:var(--sel)}.eg{display:flex;gap:6px;flex-wrap:wrap}.eb{padding:8px 16px}
.slots{display:flex;gap:10px;align-items:center}.sl{width:40px;height:40px;border-radius:50%;border:3px solid var(--bd)}.sl.on{border-color:#fff}.slots input{width:70px}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pal button{width:30px;height:30px;border-radius:50%;border:2px solid #0006}
.mut{color:var(--mut);font-size:13px}#pst{padding:6px 0;color:var(--lnk);min-height:20px;font-size:13px}
#lb{position:fixed;inset:0;background:#000d;z-index:60;display:flex;align-items:center;justify-content:center}#lb img{max-width:94%;max-height:90%}

.ib{display:inline-flex;width:42px;height:42px;border-radius:12px;background:var(--pan);border:1px solid var(--bd);color:var(--mut)}.ib:active{background:var(--hov)}
#mx{width:36px;height:36px;border-radius:10px;color:var(--mut)}
#top .ic .ico{width:22px;height:22px}.pill .ico{width:15px;height:15px}
.c .ic{display:flex;justify-content:center}.c .ico{width:18px;height:18px}
.cat i{display:inline-flex}.cat i .ico{width:12px;height:12px}
#bar .ico,#rec .ico{width:24px;height:24px}
.chip button{display:flex;align-items:center;justify-content:center}.chip button .ico{width:14px;height:14px}
.file .ico{width:26px;height:26px;color:var(--mut)}
.pop>button .ico{width:20px;height:20px}
#msgs{padding-top:16px}.m.long{background:#08101f}
.act{padding:2px}.m:hover .act,.m.long .act{display:flex}.act button{padding:8px 12px;display:flex}
.dl{padding:6px 4px 0}.dl label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:8px 0 6px}
.idr{display:flex;gap:8px;align-items:center;margin:6px 0}.idr input,.idr select{flex:1;min-width:0}.idr .btn{flex:none}
.dav{width:30px;height:30px;border-radius:50%;flex:none}.dx{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.mb{cursor:pointer}
.mi{display:flex;gap:12px;align-items:center;margin-bottom:12px}.mi img{width:56px;height:56px;border-radius:50%}.mi b{color:var(--hd);font-size:17px}
.abs{display:grid;gap:6px}.ab{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--pan);border:1px solid var(--bd);text-align:start}.ab:active{background:var(--sel)}.ab.dng{color:#fca5a5}
.sch{display:grid;gap:6px;max-height:260px;overflow-y:auto;margin-bottom:8px}
.sr{display:flex;align-items:center;gap:8px;background:var(--pan);border-radius:12px;padding:6px 10px;color:var(--mut)}.sr .ico{width:18px;height:18px}
.sr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.sr button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--mut)}
#emo img{width:28px;height:28px;object-fit:contain}#emo .mut{grid-column:1/-1;padding:8px}

html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tx,.ed,.ct,input,textarea,.mb span{-webkit-user-select:text;user-select:text}
#top{padding-top:env(safe-area-inset-top,0);height:calc(56px + env(safe-area-inset-top,0))}
#tabs{display:none}.sct{overflow-x:auto}.tb{white-space:nowrap;flex:none}
.rdot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
#md label.ck{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:400;color:var(--txt);margin:8px 0}
.ab.on{background:var(--sel);border-color:var(--acc2)}.sr .btn{width:auto;height:auto;padding:6px 12px;font-size:13px}.btn.dg{background:#7f1d1d;color:#fecaca}

/* ===== عرض الرسائل ===== */
function md(s,m){

   .replace(/\|\|(.+?)\|\|/g,'<span class="sp" onclick="this.classList.add(\'on\')">$1</span>')

    $('#p_r').innerHTML=`<label>الاسم</label><input id="re_n" value="${esc(r.name)}"><label>اللون</label><input id="re_c" type="color" value="${rcol(r.color)}"><label class="ck"><input type="checkbox" id="re_h" ${r.hoist?'checked':''}>عرض الأعضاء بشكل منفصل</label><label class="ck"><input type="checkbox" id="re_m" ${r.mentionable?'checked':''}>السماح بمنشن الرتبة</label><label>الصلاحيات</label>${PERMS.map(([b,n])=>`<label class="ck"><input type="checkbox" data-b="${b}" ${(P>>BigInt(b))&1n?'checked':''}>${n}</label>`).join('')}<div class="idr"><button class="btn" data-k="rs">حفظ الرتبة</button><button class="btn gh" data-k="rb">رجوع</button></div>`;
  };
  chRows();const md=$('#md');
  md.oninput=async e=>{if(e.target.id==='s_i'&&e.target.files[0]){try{icon=await imgData(e.target.files[0],256,256,'image/png')}catch(x){alert('الصورة ما انقرت')}}};
  md.onclick=async e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.dataset.p){tab=t.dataset.p;md.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b===t));TB.forEach(x=>$('#p_'+x[0]).hidden=x[0]!==tab);say('');return panel(tab)}
    const k=t.dataset.k,id=t.dataset.id;if(!k)return;
    try{
      if(k==='re')return roleEd(id);if(k==='rb')return panel('r');
      if(k==='rn'){const c=chMap[id],b={name:prompt('الاسم',c.name)};if(!b.name)return;if(c.type===0||c.type===5){const tp=prompt('الوصف (Topic)',c.topic||'');if(tp!==null)b.topic=tp}if(c.type===0){const sm=prompt('الوضع البطيء بالثواني (0 = بدون)',c.rate_limit_per_user||0);if(sm!==null)b.rate_limit_per_user=+sm||0}await api('/channels/'+id,'PATCH',b)}
      else if(k==='dl'){if(!confirm('حذف '+chMap[id].name+'؟'))return;await api('/channels/'+id,'DELETE')}
      else if(k==='ca'){const n=$('#s_cn').value.trim();if(!n)return;await api(`/guilds/${g.id}/channels`,'POST',{name:n,type:+$('#s_ct').value});$('#s_cn').value=''}
      else if(k==='ra'){const n=$('#r_n').value.trim();if(!n)return;await api(`/guilds/${g.id}/roles`,'POST',{name:n,color:parseInt($('#r_c').value.slice(1),16)})}
      else if(k==='rd'){if(!confirm('حذف الرتبة؟'))return;await api(`/guilds/${g.id}/roles/${id}`,'DELETE')}
      else if(k==='rs'){let p=BigInt(editing.permissions);md.querySelectorAll('[data-b]').forEach(c=>{const m=1n<<BigInt(c.dataset.b);p=c.checked?p|m:p&~m});const cv=$('#re_c').value,col=!editing.color&&cv===rcol(0)?0:parseInt(cv.slice(1),16);
        await api(`/guilds/${g.id}/roles/${editing.id}`,'PATCH',{name:$('#re_n').value.trim(),color:col,hoist:$('#re_h').checked,mentionable:$('#re_m').checked,permissions:p.toString()})}
      else if(k==='ub')await api(`/guilds/${g.id}/bans/${id}`,'DELETE');
      else if(k==='ed'){if(!confirm('حذف الإيموجي؟'))return;await api(`/guilds/${g.id}/emojis/${id}`,'DELETE')}
      else if(k==='ea'){const f=$('#em_f').files[0],n=$('#em_n').value.trim();if(!f||!n)return say('اكتب الاسم واختر صورة');await api(`/guilds/${g.id}/emojis`,'POST',{name:n,image:await imgData(f,128,128,'image/png')})}
      else if(k==='id')await api('/invites/'+id,'DELETE');
      else if(k==='ia'){const c=Object.values(chMap).find(c=>c.type===0),r=await api(`/channels/${c.id}/invites`,'POST',{max_age:+$('#i_a').value,max_uses:0});await panel('i');$('#i_l').textContent='https://discord.gg/'+r.code;return}
      else if(k==='lv'){if(!confirm('مغادرة '+g.name+'؟'))return;await api('/users/@me/guilds/'+g.id,'DELETE');return location.reload()}
      if(['rn','dl','ca'].includes(k))await openGuild(g,curEl);
      if(['ra','rd','rs','ub'].includes(k))loadMembers(g);if(['ea','ed'].includes(k))loadEmojis(g);
      await panel(tab);say('تم');
    }catch(err){say('تعذر التنفيذ: '+err.message)}
  };
}

/* ===== إيموجي السيرفر المخصص ===== */
const QE=['👍','❤️','😂','😮','😢','🎉','🔥','👎'];
async function loadEmojis(g){
  const b=$('#emo');b.innerHTML='';
  QE.forEach(q=>{const e=E('button','',q);e.onclick=()=>{
    if(reactMsg){addReaction(reactMsg,q);reactMsg=null;popTo('#emo');return}
    $('#in').value+=q;$('#in').focus();tog()};b.append(e)});
  try{const l=(await api(`/guilds/${g.id}/emojis`)).filter(x=>x.available!==false);
    if(!l.length)return;
    l.forEach(x=>{const e=E('button','',`<img src="https://cdn.discordapp.com/emojis/${x.id}.${x.animated?'gif':'webp'}?size=48" alt="${esc(x.name)}">`);
      e.onclick=()=>{
        if(reactMsg){addReaction(reactMsg,`${x.name}:${x.id}`);reactMsg=null;popTo('#emo');return}
        $('#in').value+=`<${x.animated?'a':''}:${x.name}:${x.id}>`;$('#in').focus();tog()};b.append(e)});
  }catch(e){b.append(E('div','mut','تعذر جلب الإيموجي.'))}
}
/* ===== منشن + بايو + رياكشن من الرسائل ===== */
function mentionUser(id){$('#in').value+=`<@${id}> `;tog();$('#in').focus()}
async function openUserProfile(id){
  if(cur){const x=memCache.find(z=>z.user.id===id);if(x)return memberSheet(cur,x)}
  try{
    const u=await api(`/users/${id}`);
    modal(esc(u.global_name||u.username),`<div class="mi"><img src="${avUrl(u,96)}"><div><b>${esc(u.global_name||u.username)}</b><div class="mut" dir="ltr">@${esc(u.username)} - ${u.id}</div></div></div>${u.bio?`<div class="mut" style="padding:8px 0;white-space:pre-wrap">${esc(u.bio)}</div>`:''}<div class="abs">${chan&&!chan.dm?`<button class="ab" data-a="men">${I('at')}<span>منشن في الرسالة</span></button>`:''}<button class="ab" data-a="dm">${I('dm')}<span>مراسلته في الخاص</span></button><button class="ab" data-a="cp">${I('copy')}<span>نسخ الآيدي</span></button></div>`,()=>{},'');
    $('#md').onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
      if(a==='men'){mentionUser(id);$('#ov').hidden=true}
      else if(a==='dm'){$('#ov').hidden=true;openDM(id,u)}
      else if(a==='cp')navigator.clipboard.writeText(id)};
  }catch(e){alert('تعذر جلب الملف الشخصي: '+e.message)}
}
async function addReaction(m,emoji){
  try{await api(`/channels/${m.channel_id}/messages/${m.id}/reactions/${encodeURIComponent(emoji)}/@me`,'PUT');
    const r=(m.reactions=m.reactions||[]).find(x=>x.emoji.id?`${x.emoji.name}:${x.emoji.id}`===emoji:x.emoji.name===emoji);
    if(r){r.count++;r.me=true}else m.reactions.push({emoji:emoji.includes(':')?{id:emoji.split(':')[1],name:emoji.split(':')[0]}:{id:null,name:emoji},count:1,me:true});
    const row=document.querySelector(`.m[data-id="${m.id}"] .rxs`);if(row)row.innerHTML=rxInner(m);
  }catch(e){alert('تعذر إضافة الرياكشن: '+e.message)}
}
async function toggleReaction(el){
  const md=el.closest('.m'),m=msgMap.get(md.dataset.id);if(!m)return;
  const emoji=el.dataset.emoji,me_=el.dataset.me==='1',M=`/channels/${m.channel_id}/messages/${m.id}/reactions/${encodeURIComponent(emoji)}/@me`;
  try{
    await api(M,me_?'DELETE':'PUT');
    const r=m.reactions.find(x=>(x.emoji.id?`${x.emoji.name}:${x.emoji.id}`:x.emoji.name)===emoji);
    if(r){r.me=!me_;r.count+=me_?-1:1;if(r.count<=0)m.reactions=m.reactions.filter(x=>x!==r)}
    const row=md.querySelector('.rxs');if(row)row.innerHTML=rxInner(m);
  }catch(e){alert('تعذر تنفيذ الرياكشن: '+e.message)}
}
$('#msgs').addEventListener('click',e=>{
  const rx=e.target.closest('.rx');if(rx)return toggleReaction(rx);
  const ra=e.target.closest('.rxadd');if(ra){reactMsg=msgMap.get(ra.closest('.m').dataset.id);$('#emb').click();return}
  const nm=e.target.closest('.nm[data-id]');if(nm)return mentionUser(nm.dataset.id);
  const mn=e.target.closest('.mn[data-id]');if(mn)return openUserProfile(mn.dataset.id);
  const av=e.target.closest('.av[data-id]');if(av)return openUserProfile(av.dataset.id);
});
/* ===== إكمال المنشن التلقائي (@) ===== */
function macQuery(){
  const v=$('#in').value,p=$('#in').selectionStart||v.length,up=v.slice(0,p),mt=up.match(/(^|\s)@([^\s@]{0,32})$/);
  return mt?mt[2]:null;
}
function macClose(){$('#mac').hidden=true}
function macShow(){
  const q=macQuery();
  if(q===null||!cur){macClose();return}
  const ql=q.toLowerCase(),list=memCache.filter(x=>!x.user.bot&&((x.nick||'').toLowerCase().includes(ql)||x.user.username.toLowerCase().includes(ql)||(x.user.global_name||'').toLowerCase().includes(ql))).slice(0,8);
  if(!list.length){macClose();return}
  const b=$('#mac');b.innerHTML='';
  list.forEach(x=>{const nm=x.nick||x.user.global_name||x.user.username,e=E('button','',`<img src="${avUrl(x.user,64)}"><span>${esc(nm)} <small dir="ltr">@${esc(x.user.username)}</small></span>`);
    e.onclick=()=>{
      const v=$('#in').value,p=$('#in').selectionStart||v.length,up=v.slice(0,p),mt=up.match(/(^|\s)@([^\s@]{0,32})$/);
      if(!mt)return;
      const start=p-mt[2].length-1;
      $('#in').value=v.slice(0,start)+`<@${x.user.id}> `+v.slice(p);
      $('#in').focus();tog();macClose();
    };b.append(e)});
  b.hidden=false;
}
$('#in').addEventListener('input',macShow);
$('#in').addEventListener('keydown',e=>{if(!$('#mac').hidden&&e.key==='Escape'){macClose();e.stopPropagation()}});
$('#in').addEventListener('blur',()=>setTimeout(macClose,150));
$('#cfg').onclick=profileModal;
/* ===== سلوك التطبيق ===== */
const tabOn=t=>document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
$('#tabs').onclick=e=>{const t=e.target.closest('button')?.dataset.t;if(!t)return;
  if(t==='home')nav(true);else if(t==='dm')showDMs();else if(t==='mem')$('#memb').click();else profileModal()};
let sx,sy;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(!mobile()||!$('#ov').hidden)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;
  const no=$('#nav').classList.contains('open'),mo=$('#mem').classList.contains('open'),W=innerWidth;
  if(no&&dx>0)nav(false);else if(mo&&dx<0)$('#back').click();
  else if(!no&&!mo&&dx<0&&sx>W*.7)nav(true);else if(!no&&!mo&&dx>0&&sx<W*.3&&cur)$('#memb').click()},{passive:true});
const ph=()=>history.pushState({u:1},'');
addEventListener('popstate',()=>{if(!$('#ov').hidden)$('#ov').hidden=true;else if(!$('#lb').hidden)$('#lb').hidden=true;else{nav(false);$('#mem').classList.remove('open');$('#back').hidden=true}});
addEventListener('focusin',e=>{if(e.target.matches('input,textarea'))document.body.classList.add('kb')});
addEventListener('focusout',()=>document.body.classList.remove('kb'));
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(!ip)return;ip.prompt();await ip.userChoice;ip=null;$('#inst').hidden=true};
addEventListener('appinstalled',()=>$('#inst').hidden=true);$('#homeb').onclick=showDMs;$('#settb').onclick=guildModal;
</script>
